<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Monthly Bill Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:20px 16px}h1{margin:0;font-size:24px}.sub{font-size:13px;opacity:.75;margin-top:4px}
main{max-width:850px;margin:auto;padding:14px}.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.monthbar button{width:42px;padding:9px}.month{font-size:18px;font-weight:700;text-align:center;flex:1}
button{border:0;border-radius:10px;padding:10px 13px;background:#111827;color:#fff;font-weight:600}.cards,.bankgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.card{background:#fff;border-radius:14px;padding:13px;box-shadow:0 1px 4px #0001}.label{font-size:11px;color:#6b7280;font-weight:700}.money{font-size:20px;font-weight:800;margin-top:4px}.bank{border-top:4px solid #111827}
.section{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}.section h2{font-size:18px;margin:0}.note{font-size:12px;color:#6b7280;margin-bottom:12px}
.bill{background:#fff;border-radius:14px;padding:13px;margin-bottom:9px;box-shadow:0 1px 4px #0001;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center}.bill input{width:22px;height:22px}.billname{font-weight:700}.meta{font-size:12px;color:#6b7280;margin-top:3px}.amount{text-align:right;font-weight:800}.paid{text-decoration:line-through;opacity:.5}
.small{padding:6px 9px;font-size:12px;background:#e5e7eb;color:#111827;margin-top:7px}.empty{background:#fff;padding:22px;text-align:center;border-radius:14px;color:#6b7280}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:850px;margin:auto;border-radius:18px 18px 0 0;padding:18px;max-height:90vh;overflow:auto}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input[type=text],input[type=number],select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formactions{display:flex;gap:8px;margin-top:16px}.danger{background:#b91c1c}
@media(max-width:600px){.cards,.bankgrid{grid-template-columns:1fr 1fr}.cards .card:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<header><h1>Monthly Bill Tracker</h1><div class="sub">Recurring bills • Paid • Still Needed</div></header>
<main>
<div class="monthbar"><button onclick="changeMonth(-1)">‹</button><div class="month" id="monthLabel"></div><button onclick="changeMonth(1)">›</button></div>
<div class="cards">
<div class="card"><div class="label">TOTAL MONTHLY BILLS</div><div class="money" id="total">$0.00</div></div>
<div class="card"><div class="label">PAID</div><div class="money" id="paid">$0.00</div></div>
<div class="card"><div class="label">STILL NEEDED</div><div class="money" id="needed">$0.00</div></div>
</div>
<div class="bankgrid" id="banks"></div>
<div class="section"><h2>Recurring Bills</h2><button onclick="openForm()">+ Add Bill</button></div>
<div class="note">Bills automatically repeat every month. Paid status resets for each new month.</div>
<div id="bills"></div>
</main>
<div class="modal" id="modal"><div class="sheet">
<div class="section"><h2 id="formTitle">Add Recurring Bill</h2><button class="small" onclick="closeForm()">Close</button></div>
<form id="form"><input type="hidden" id="editId">
<label>Bill name</label><input id="name" type="text" required placeholder="Mortgage">
<div class="row"><div><label>Monthly amount</label><input id="amount" type="number" min="0" step="0.01" required placeholder="2500"></div>
<div><label>Due day</label><input id="due" type="number" min="1" max="31" required placeholder="1"></div></div>
<label>Bank</label><select id="bank"><option>USAA</option><option>PenFed</option><option>Navy Federal</option></select>
<div class="formactions"><button type="submit">Save Bill</button><button type="button" class="danger" id="deleteBtn" style="display:none" onclick="deleteBill()">Delete</button></div>
</form></div></div>
<script>
const BANKS=["USAA","PenFed","Navy Federal"];
let bills=JSON.parse(localStorage.getItem("recurringBills")||"[]");
let payments=JSON.parse(localStorage.getItem("billPayments")||"{}");
let current=new Date();current=new Date(current.getFullYear(),current.getMonth(),1);
function money(n){return n.toLocaleString("en-US",{style:"currency",currency:"USD"})}
function monthKey(){return current.getFullYear()+"-"+String(current.getMonth()+1).padStart(2,"0")}
function save(){localStorage.setItem("recurringBills",JSON.stringify(bills));localStorage.setItem("billPayments",JSON.stringify(payments))}
function render(){
 document.getElementById("monthLabel").textContent=current.toLocaleDateString("en-US",{month:"long",year:"numeric"});
 let total=0,paid=0;bills.forEach(b=>{total+=Number(b.amount);if(payments[monthKey()]?.[b.id])paid+=Number(b.amount)});
 document.getElementById("total").textContent=money(total);document.getElementById("paid").textContent=money(paid);document.getElementById("needed").textContent=money(total-paid);
 document.getElementById("banks").innerHTML=BANKS.map(bank=>{let t=0,p=0;bills.filter(b=>b.bank===bank).forEach(b=>{t+=Number(b.amount);if(payments[monthKey()]?.[b.id])p+=Number(b.amount)});return `<div class="card bank"><div class="label">${bank.toUpperCase()}</div><div class="money">${money(t-p)}</div><div class="meta">Still needed</div><div class="meta">Total: ${money(t)} • Paid: ${money(p)}</div></div>`}).join("");
 const list=document.getElementById("bills");if(!bills.length){list.innerHTML='<div class="empty">No recurring bills yet.<br>Tap “+ Add Bill” to add your first one.</div>';return}
 bills.sort((a,b)=>Number(a.due)-Number(b.due));list.innerHTML=bills.map(b=>{const isPaid=!!(payments[monthKey()]?.[b.id]);return `<div class="bill"><input type="checkbox" ${isPaid?"checked":""} onchange="togglePaid('${b.id}',this.checked)"><div><div class="billname ${isPaid?"paid":""}">${escapeHtml(b.name)}</div><div class="meta">${escapeHtml(b.bank)} • Due day ${b.due}</div><button class="small" onclick="editBill('${b.id}')">Edit</button></div><div class="amount ${isPaid?"paid":""}">${money(Number(b.amount))}</div></div>`}).join("")
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function togglePaid(id,value){if(!payments[monthKey()])payments[monthKey()]={};if(value)payments[monthKey()][id]=true;else delete payments[monthKey()][id];save();render()}
function changeMonth(amount){current=new Date(current.getFullYear(),current.getMonth()+amount,1);render()}
function openForm(id=null){document.getElementById("modal").classList.add("open");document.getElementById("form").reset();document.getElementById("editId").value=id||"";document.getElementById("formTitle").textContent=id?"Edit Recurring Bill":"Add Recurring Bill";document.getElementById("deleteBtn").style.display=id?"block":"none";if(id){const b=bills.find(x=>x.id===id);document.getElementById("name").value=b.name;document.getElementById("amount").value=b.amount;document.getElementById("due").value=b.due;document.getElementById("bank").value=b.bank}}
function closeForm(){document.getElementById("modal").classList.remove("open")}
document.getElementById("form").onsubmit=function(e){e.preventDefault();const id=document.getElementById("editId").value;const bill={id:id||Date.now().toString(36)+Math.random().toString(36).slice(2),name:document.getElementById("name").value.trim(),amount:Number(document.getElementById("amount").value),due:Number(document.getElementById("due").value),bank:document.getElementById("bank").value};if(id){const i=bills.findIndex(x=>x.id===id);bills[i]=bill}else bills.push(bill);save();closeForm();render()}
function editBill(id){openForm(id)}
function deleteBill(){const id=document.getElementById("editId").value;if(confirm("Delete this recurring bill?")){bills=bills.filter(b=>b.id!==id);Object.values(payments).forEach(m=>delete m[id]);save();closeForm();render()}}
render();
</script>
</body></html>
